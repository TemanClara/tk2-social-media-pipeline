[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tk2-social-media-pipeline"
version = "0.1.0"
description = "Pengumpulan data percakapan publik mengenai Teddy Indra Wijaya (TK-2 Analitika Media Sosial)"
requires-python = ">=3.10"

# Versi dipatok pada rentang minor yang sama (~=) agar tiap anggota tim
# mendapat perilaku yang sama. Untuk penguncian penuh, lihat
# requirements.lock.txt dan cara membuatnya di README.
# Hanya yang benar-benar dipakai kode saat ini. Dependensi yang didaftarkan
# tapi tidak dipakai memperbesar peluang gagal pasang tanpa manfaat.
dependencies = [
    "requests~=2.32",
    "python-dotenv~=1.0",
    "PyYAML~=6.0",
]

[project.optional-dependencies]
# Dibutuhkan library omkarcloud di third_party/ (scraper TikTok dan Instagram).
# Versi yang diuji: curl_cffi 0.16.3, marshmallow 4.3.1.
scrapers = ["curl_cffi~=0.16", "marshmallow~=4.3"]
# Untuk tahap processing (src/process.py) dan pemeriksaan dataset.
# pyarrow dibutuhkan pandas untuk menulis Parquet.
analysis = ["pandas~=2.2", "pyarrow>=17", "tqdm~=4.66"]

[project.scripts]
tk2-scrape = "src.run_scrape:main"

[tool.setuptools.packages.find]
include = ["src*"]
