# Parameter pengumpulan data. Scraper membaca dari sini, jadi tidak ada kata
# kunci yang ditulis langsung di dalam kode. Dataset akhir hanya dari TikTok
# (docs/decisions.md bagian 6).

periode:
  mulai: "2024-10-01"   # pelantikan sebagai Sekretaris Kabinet
  selesai: "2026-09-30" # batas periode pada proposal TK-1

# Jendela waktu sesudah peristiwa pemicu. Dipakai bila memilih
# pengambilan sampel per peristiwa, bukan pengumpulan penuh dua tahun.
peristiwa_pemicu:
  - nama: pengumuman_kabinet
    tanggal: "2024-10-20"
    jendela_hari: 14
  - nama: kenaikan_pangkat_letkol
    tanggal: "2025-02-25"
    jendela_hari: 14
  - nama: viral_social_experiment
    tanggal: "2026-05-13"
    jendela_hari: 14

kata_kunci:
  - "Teddy Indra Wijaya"
  - "Mayor Teddy"
  - "Letkol Teddy"
  - "Seskab Teddy"

hashtag:
  - "mayorteddy"
  - "seskabteddy"
  - "teddyindrawijaya"
  - "letkolteddy"

akun_target:
  tiktok: []     # Belum diisi: handle TikTok akun fanbase/media belum ditetapkan.
                 # Dataset akhir dikumpulkan tanpa --with-accounts.
  instagram: []  # Tidak dipakai (dataset akhir hanya TikTok)
  x: []          # Tidak dipakai (dataset akhir hanya TikTok)

bahasa:
  utama: "id"
  sertakan_non_indonesia: false  # Dipakai filter lang: X. TikTok tidak disaring
                                 # saat scraping; ditandai flag_non_indonesian
                                 # di src/process.py

volume_target:
  tiktok: 1000
  instagram: 0
  x: 0
